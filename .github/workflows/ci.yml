name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Show Xcode version
        run: /Applications/Xcode.app/Contents/Developer/usr/bin/xcodebuild -version

      - name: Run tests and builds
        run: make ci

