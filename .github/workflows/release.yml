name: CD

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v"
        required: true
        type: string
      publish_homebrew:
        description: "Update the configured Homebrew tap after publishing the release"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    name: Build Release
    runs-on: macos-latest

    outputs:
      artifact_name: ${{ steps.release-vars.outputs.artifact_name }}
      download_url: ${{ steps.release-vars.outputs.download_url }}
      sha256: ${{ steps.release-vars.outputs.sha256 }}
      tag: ${{ steps.release-vars.outputs.tag }}
      version: ${{ steps.release-vars.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
            version="${tag#v}"
          else
            version="${{ inputs.version }}"
            tag="v${version}"
          fi

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Run coverage gate
        run: make coverage

      - name: Smoke test Homebrew cask generation
        run: make smoke-homebrew-cask

      - name: Build and smoke test macOS release zip
        run: make smoke-macos-package VERSION="${{ steps.version.outputs.version }}"

      - name: Capture release outputs
        id: release-vars
        shell: bash
        run: |
          set -euo pipefail

          version="${{ steps.version.outputs.version }}"
          tag="${{ steps.version.outputs.tag }}"
          artifact_name="HEICToPNG-${version}.zip"
          artifact_path=".build/release/${artifact_name}"
          sha256="$(cut -d ' ' -f 1 "${artifact_path}.sha256")"
          download_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/${artifact_name}"

          echo "artifact_name=${artifact_name}" >> "$GITHUB_OUTPUT"
          echo "download_url=${download_url}" >> "$GITHUB_OUTPUT"
          echo "sha256=${sha256}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.release-vars.outputs.artifact_name }}
          path: |
            .build/release/${{ steps.release-vars.outputs.artifact_name }}
            .build/release/${{ steps.release-vars.outputs.artifact_name }}.sha256

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          tag="${{ steps.release-vars.outputs.tag }}"
          artifact=".build/release/${{ steps.release-vars.outputs.artifact_name }}"
          checksum="${artifact}.sha256"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$artifact" "$checksum" --clobber
          else
            gh release create "$tag" "$artifact" "$checksum" \
              --target "$GITHUB_SHA" \
              --title "$tag" \
              --notes "macOS app release for HEIC to PNG."
          fi

  homebrew:
    name: Update Homebrew Tap
    runs-on: ubuntu-latest
    needs: release
    if: ${{ github.event_name == 'push' || github.event.inputs.publish_homebrew == 'true' }}

    env:
      HOMEBREW_TAP_REPO: ${{ secrets.HOMEBREW_TAP_REPO }}
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}

    steps:
      - name: Check Homebrew tap configuration
        id: tap-config
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${HOMEBREW_TAP_REPO}" ]]; then
            echo "HOMEBREW_TAP_REPO is required when publishing Homebrew releases." >&2
            exit 1
          fi

          if [[ -n "${HOMEBREW_TAP_DEPLOY_KEY}" ]]; then
            echo "auth_mode=ssh" >> "$GITHUB_OUTPUT"
          elif [[ -n "${HOMEBREW_TAP_TOKEN}" ]]; then
            echo "auth_mode=token" >> "$GITHUB_OUTPUT"
          else
            echo "Configure HOMEBREW_TAP_DEPLOY_KEY or HOMEBREW_TAP_TOKEN before publishing Homebrew releases." >&2
            exit 1
          fi

      - name: Check out source repository
        uses: actions/checkout@v6
        with:
          path: source

      - name: Check out Homebrew tap with deploy key
        if: steps.tap-config.outputs.auth_mode == 'ssh'
        uses: actions/checkout@v6
        with:
          repository: ${{ env.HOMEBREW_TAP_REPO }}
          ref: main
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: homebrew-tap

      - name: Check out Homebrew tap with token
        if: steps.tap-config.outputs.auth_mode == 'token'
        uses: actions/checkout@v6
        with:
          repository: ${{ env.HOMEBREW_TAP_REPO }}
          ref: main
          token: ${{ env.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update cask
        shell: bash
        run: |
          set -euo pipefail

          source/.github/scripts/update-homebrew-cask.sh \
            "homebrew-tap" \
            "${{ needs.release.outputs.version }}" \
            "${{ needs.release.outputs.sha256 }}" \
            "${{ needs.release.outputs.download_url }}" \
            "https://github.com/${GITHUB_REPOSITORY}"

      - name: Commit and push tap update
        shell: bash
        run: |
          set -euo pipefail

          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [[ -z "$(git status --porcelain -- Casks/heic-to-png.rb)" ]]; then
            echo "Homebrew cask is already up to date."
          else
            git add Casks/heic-to-png.rb
            git commit -m "Update heic-to-png to ${{ needs.release.outputs.version }}"
            git push origin HEAD:main
          fi
